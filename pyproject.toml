[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matmem"
version = "0.2.0"
description = "Oracle-isolated active search with delayed structured labels and convex-hull evaluation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.5",
  "sqlalchemy>=2,<3",
  "structlog>=23.2",
  "numpy>=2",
  "ijson>=3.3,<4",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pymatgen>=2025",
  "dscribe>=2.1",
  "psutil>=5.9",
  "chgnet>=0.4.2,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/matmem/__init__.py" = ["F401"]
"src/matmem/protocol_knowledge_gradient.py" = ["F401"]
"src/matmem/protocol_policy_worker.py" = ["E402"]
